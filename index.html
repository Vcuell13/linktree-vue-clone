<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👍</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree Clone - Vue</title>

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+CU+Guides&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom Theme (unique from rromanv) -->
    <style>
      :root {
        --bg: #0f0f11;
        --card: #1a1a1d;
        --primary: #7c3aed;
        --accent: #22d3ee;
        --text: #f5f5f7;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", "Poppins", "Google Sans", sans-serif;
      }

      .link-card {
        background: var(--card);
        border: 1px solid var(--primary);
        transition: 0.2s ease;
      }

      .link-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }

      .btn-primary:hover {
        background: var(--accent);
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
